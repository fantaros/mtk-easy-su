apply plugin: 'com.android.application'

apply plugin: 'kotlin-android'

final Properties env = new Properties()
file("${rootDir}/env.properties").withInputStream { env.load(it) }

android {

    applicationVariants.configureEach { variant ->
        variant.outputs.configureEach {
            outputFileName = "mtk-easy-su-v${defaultConfig.versionName}.apk"
        }
    }

    signingConfigs {
        release {
            storeFile file("${rootDir}/key.jks")
            storePassword env['key.password']
            keyPassword env['key.password']
            keyAlias env['key.alias']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8.toString()
    }

    defaultConfig {
        applicationId 'juniojsv.mtk.easy.su'
        // Android 4.4.4 (KitKat, API 19)
        minSdkVersion 19
        compileSdk 34
        versionCode 210
        versionName "2.2.1"
    }

    buildTypes {
        configureEach {
            resValue "string", "application_advertising_id", env['application.advertising.id']
            resValue "string", "interstitial_advertising_id", env['interstitial.advertising.id']
            resValue "string", "banner_advertising_id", env['banner.advertising.id']
            resValue "string", "admob_test_device", env['admob.test.device']
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
    namespace 'juniojsv.mtk.easy.su'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.6.0'
    implementation 'com.google.android.material:material:1.4.0'
    // 24.x 的 play-services-ads 要求 minSdk 21，降级到支持 API 19 的 20.6.0
    implementation 'com.google.android.gms:play-services-ads:20.6.0'
    // 1.6.x 之后的 coroutines 主要针对 API 21+，保留支持 API 19 的稳定版本
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.5.2'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    // Firebase 依赖（crashlytics/analytics）会把 minSdk 抬升到 21+，Android 4.4.4 不支持，故移除。
    // 保留 Crashlytics 风格的崩溃日志上报能力的最小替代：仅使用 Android Log。
}
